name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            os: darwin
            arch: arm64
          - runner: macos-15-intel
            os: darwin
            arch: x86_64
          - runner: ubuntu-24.04
            os: linux
            arch: x86_64
          - runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Build patched proxy
        shell: bash
        run: |
          set -euo pipefail
          rustup update stable --no-self-update
          upstream_version="$(cat upstream-version)"
          git clone --quiet --depth 1 --branch "v${upstream_version}" \
            https://github.com/raine/claude-code-proxy.git upstream
          git -C upstream apply "$GITHUB_WORKSPACE/patches/model-discovery.patch"
          cargo fmt --manifest-path upstream/Cargo.toml --check
          cargo test --manifest-path upstream/Cargo.toml normalize_model_trims_hint --lib
          cargo build --manifest-path upstream/Cargo.toml --release --locked

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package
          cp upstream/target/release/claude-code-proxy package/claude-code-proxy
          cp bin/claudex package/claudex
          chmod 755 package/claude-code-proxy package/claudex
          tar -C package -czf "claudex-${{ matrix.os }}-${{ matrix.arch }}.tar.gz" \
            claude-code-proxy claudex

      - uses: actions/upload-artifact@v7
        with:
          name: claudex-${{ matrix.os }}-${{ matrix.arch }}
          path: claudex-${{ matrix.os }}-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: claudex-*
          path: dist
          merge-multiple: true

      - name: Create checksums
        run: |
          cd dist
          sha256sum -- *.tar.gz > SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --title "Claudex $GITHUB_REF_NAME" \
            --generate-notes
